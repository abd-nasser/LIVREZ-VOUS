<div class="relative overflow-hidden rounded-3xl border border-[#059669]/30 bg-base-100 p-8 text-center shadow-xl animate-fade-in sm:p-10">
    <div class="pointer-events-none absolute -top-16 left-1/2 h-48 w-48 -translate-x-1/2 rounded-full bg-[#059669]/15 blur-3xl"></div>

    <div class="relative z-10 mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full border-2 border-[#059669] bg-[#059669]/10 text-[#059669]">
        <svg class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
        </svg>
    </div>

    <span class="relative z-10 badge mb-3 border-none bg-[#059669] px-3 py-1 text-[11px] font-bold uppercase tracking-wider text-white">
        Identifiants mis à jour
    </span>
    <h2 class="relative z-10 text-2xl font-extrabold tracking-tight text-base-content sm:text-3xl">
        {{ title|default:Title }}
    </h2>
    <p class="relative z-10 mx-auto mt-3 max-w-md text-sm leading-relaxed text-base-content/70">
        {{ message }}
    </p>

    <a href="{{ profile_url }}" class="relative z-10 mt-7 inline-flex btn rounded-xl border-none bg-[#059669] font-bold text-white hover:bg-[#047857]">
        Retour à mon profil
    </a>
</div>
