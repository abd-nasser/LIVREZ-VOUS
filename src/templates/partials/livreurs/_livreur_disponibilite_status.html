<div id="livreur-disponibilite-{{ livreur.pk }}"
     x-data="{ 
         showToast: {% if request.method == 'POST' %}true{% else %}false{% endif %},
         init() {
             if (this.showToast) {
                 setTimeout(() => { this.showToast = false; }, 3000);
             }
         }
     }">

    <!-- Bouton Toggle avec HTMX -->
    <button hx-post="#"
            hx-target="#livreur-disponibilite-{{ livreur.pk }}"
            hx-swap="outerHTML"
            class="btn btn-sm {% if livreur.est_disponible %}btn-success{% else %}btn-error{% endif %} flex items-center gap-2">
        
        <span class="inline-block w-2.5 h-2.5 rounded-full {% if livreur.est_disponible %}bg-white animate-pulse{% else %}bg-gray-200{% endif %}"></span>
        
        {% if livreur.est_disponible %}
            Disponible
        {% else %}
            Indisponible
        {% endif %}
    </button>

    <!-- Toast de notification Alpine.js -->
    <template x-if="showToast">
        <div class="toast toast-end toast-bottom z-50 transition-all duration-300 transform"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 translate-y-4"
             x-transition:enter-end="opacity-100 translate-y-0"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100 translate-y-0"
             x-transition:leave-end="opacity-0 translate-y-4">
            
            <div class="alert {% if livreur.est_disponible %}alert-success{% else %}alert-warning{% endif %} shadow-lg text-white flex items-center justify-between gap-4">
                <div class="flex items-center gap-2">
                    {% if livreur.est_disponible %}
                        <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        <span>Le livreur est maintenant <strong>disponible</strong>.</span>
                    {% else %}
                        <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                        <span>Le livreur est désormais <strong>indisponible</strong>.</span>
                    {% endif %}
                </div>

                <!-- Bouton de fermeture manuelle -->
                <button @click="showToast = false" class="btn btn-ghost btn-xs text-white p-0 min-h-0 h-auto">
                    ✕
                </button>
            </div>
        </div>
    </template>
</div>
